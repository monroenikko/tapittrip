openapi: 3.1.0
info:
  title: TapItTrip API
  version: 0.1.1
  description: >-
    Contract for implemented behavior in the TapItTrip versioned JSON API.
    Paths are added only when a milestone slice approves and implements the
    behavior with matching tests.
  contact:
    name: TapItTrip Engineering
x-document-status: implemented
servers:
  - url: /api/v1
    description: Relative URL for the version 1 API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      description: Returns a minimal, unauthenticated liveness response without exposing dependency or environment details.
      tags:
        - System
      security: []
      responses:
        "200":
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
  /auth/register:
    post:
      operationId: register
      summary: Register a new traveler account and receive an API token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Validation failure or duplicate email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationFailed:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      details:
                        fields:
                          email:
                            - The email has already been taken.
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with credentials and receive an API token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Invalid credentials or validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: invalid_credentials
                      message: The provided credentials are incorrect.
                validationFailed:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      details:
                        fields:
                          email:
                            - The email field must be a valid email address.
  /auth/token:
    post:
      operationId: createAuthToken
      summary: Backward-compatible alias for /auth/login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token issued successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Invalid credentials or validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: invalid_credentials
                      message: The provided credentials are incorrect.
                validationFailed:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      details:
                        fields:
                          email:
                            - The email field must be a valid email address.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current access token
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Successfully logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /me:
    get:
      operationId: getProfile
      summary: Get authenticated traveler profile
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: deleteAccount
      summary: Delete traveler account and revoke access tokens
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /trips:
    get:
      operationId: listTrips
      summary: List trips the authenticated traveler is a member of
      tags:
        - Trips
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of trips.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createTrip
      summary: Create a new trip
      tags:
        - Trips
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTripRequest"
      responses:
        "201":
          description: Trip created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trips/{trip}:
    parameters:
      - name: trip
        in: path
        required: true
        description: UUID of the trip
        schema:
          type: string
          format: uuid
    get:
      operationId: getTrip
      summary: Get trip details
      tags:
        - Trips
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Trip details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not a member of this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTrip
      summary: Update trip details
      tags:
        - Trips
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
      responses:
        "200":
          description: Trip updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to edit this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrip
      summary: Delete trip
      tags:
        - Trips
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Trip deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Only trip owner can delete trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/today:
    get:
      operationId: getTripTodaySummary
      summary: Get live Today dashboard summary for a trip
      tags:
        - Trips
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Today dashboard summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/days:
    get:
      operationId: listTripDays
      summary: List days for a trip
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of trip days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDayListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTripDay
      summary: Create or find a trip day
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTripDayRequest"
      responses:
        "201":
          description: Day created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDayResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/itinerary-items:
    get:
      operationId: listItineraryItems
      summary: List itinerary items for a trip
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: trip_day_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of itinerary items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createItineraryItem
      summary: Create an itinerary item or stop
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItineraryItemRequest"
      responses:
        "201":
          description: Item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/itinerary-items/reorder:
    post:
      operationId: reorderItineraryItems
      summary: Reorder itinerary items for a trip
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderItineraryItemsRequest"
      responses:
        "200":
          description: Reordered items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/ai-plan/generate:
    post:
      operationId: generateAiItinerary
      summary: Propose an AI-generated itinerary suggestion based on preferences
      tags:
        - Itinerary
        - AI
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination
                - duration_days
              properties:
                destination:
                  type: string
                  example: "Tokyo, Japan"
                duration_days:
                  type: integer
                  minimum: 1
                  maximum: 7
                  example: 3
                budget_tier:
                  type: string
                  enum: [budget, moderate, luxury]
                  default: moderate
                travel_party:
                  type: string
                  enum: [solo, couple, family, friends, seniors]
                  default: family
                pace:
                  type: string
                  enum: [relaxed, balanced, fast]
                  default: balanced
                interests:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Suggested AI itinerary plan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
        "422":
          description: Validation error.

  /trips/{trip}/ai-plan/apply:
    post:
      operationId: applyAiItinerary
      summary: Apply approved days from an AI itinerary plan
      tags:
        - Itinerary
        - AI
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - days
              properties:
                days:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Created itinerary items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItineraryItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
        "422":
          description: Validation error.

  /trips/{trip}/assistant/query:
    post:
      operationId: queryTripAssistant
      summary: Ask TapItTrip contextual in-trip assistant
      tags:
        - Itinerary
        - AI
        - Assistant
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 500
                  example: "Where should we go tomorrow near our hotel?"
                context_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-11-11"
                terminal_code:
                  type: string
                  maxLength: 20
                  nullable: true
                  example: "T3"
      responses:
        "200":
          description: Contextual trip assistant answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reply:
                        type: string
                      category:
                        type: string
                        enum: [dining, lounge, toddler_friendly, weather, general]
                      context_summary:
                        type: object
                      suggested_actions:
                        type: array
                        items:
                          type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this trip.
        "422":
          description: Validation error.

  /itinerary-items/{item}:
    get:
      operationId: getItineraryItem
      summary: Get details of an itinerary item
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItineraryItem
      summary: Update an itinerary item
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItineraryItemRequest"
      responses:
        "200":
          description: Updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItineraryItem
      summary: Soft delete an itinerary item
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/search:
    get:
      operationId: searchPlaces
      summary: Search places by name or address
      tags:
        - Places
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching places.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /places:
    post:
      operationId: createPlace
      summary: Create or retrieve a place
      tags:
        - Places
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorePlaceRequest"
      responses:
        "201":
          description: Place stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/{place}:
    get:
      operationId: getPlace
      summary: Get place details
      tags:
        - Places
      security:
        - BearerAuth: []
      parameters:
        - name: place
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Place details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Place not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/stays:
    get:
      operationId: listTripStays
      summary: List all stays for a trip
      tags:
        - Stays
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stays list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view stays for this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: storeStay
      summary: Create an accommodation or stay for a trip
      tags:
        - Stays
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreStayRequest"
      responses:
        "201":
          description: Stay created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stays/{stay}:
    get:
      operationId: getStay
      summary: Get details of a stay
      tags:
        - Stays
      security:
        - BearerAuth: []
      parameters:
        - name: stay
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stay details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Stay not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStay
      summary: Update a stay
      tags:
        - Stays
      security:
        - BearerAuth: []
      parameters:
        - name: stay
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStayRequest"
      responses:
        "200":
          description: Updated stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayResponse"
        "401":
