                    $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Expense not found.
    patch:
      operationId: updateExpense
      summary: Update an existing expense
      tags:
        - Expenses
      security:
        - BearerAuth: []
      parameters:
        - name: expense
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "200":
          description: Expense updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Forbidden.
        "404":
          description: Expense not found.
    delete:
      operationId: deleteExpense
      summary: Delete an expense record
      tags:
        - Expenses
      security:
        - BearerAuth: []
      parameters:
        - name: expense
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Expense deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Forbidden.
        "404":
          description: Expense not found.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token issued by /auth/token
  responses:
    Unauthenticated:
      description: A valid access token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Authentication is required.
