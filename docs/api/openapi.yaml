openapi: 3.1.0
info:
  title: TapItTrip API
  version: 0.1.1
  description: >-
    Contract for implemented behavior in the TapItTrip versioned JSON API.
    Paths are added only when a milestone slice approves and implements the
    behavior with matching tests.
  contact:
    name: TapItTrip Engineering
x-document-status: implemented
servers:
  - url: /api/v1
    description: Relative URL for the version 1 API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      description: Returns a minimal, unauthenticated liveness response without exposing dependency or environment details.
      tags:
        - System
      security: []
      responses:
        "200":
          description: The API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
  /auth/register:
    post:
      operationId: register
      summary: Register a new traveler account and receive an API token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Validation failure or duplicate email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationFailed:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      details:
                        fields:
                          email:
                            - The email has already been taken.
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with credentials and receive an API token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Invalid credentials or validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: invalid_credentials
                      message: The provided credentials are incorrect.
                validationFailed:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      details:
                        fields:
                          email:
                            - The email field must be a valid email address.
  /auth/token:
    post:
      operationId: createAuthToken
      summary: Backward-compatible alias for /auth/login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token issued successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "422":
          description: Invalid credentials or validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: invalid_credentials
                      message: The provided credentials are incorrect.
                validationFailed:
                  value:
                    error:
                      code: validation_failed
                      message: The given data was invalid.
                      details:
                        fields:
                          email:
                            - The email field must be a valid email address.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current access token
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Successfully logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /me:
    get:
      operationId: getProfile
      summary: Get authenticated traveler profile
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: deleteAccount
      summary: Delete traveler account and revoke access tokens
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /trips:
    get:
      operationId: listTrips
      summary: List trips the authenticated traveler is a member of
      tags:
        - Trips
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of trips.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createTrip
      summary: Create a new trip
      tags:
        - Trips
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTripRequest"
      responses:
        "201":
          description: Trip created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trips/{trip}:
    parameters:
      - name: trip
        in: path
        required: true
        description: UUID of the trip
        schema:
          type: string
          format: uuid
    get:
      operationId: getTrip
      summary: Get trip details
      tags:
        - Trips
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Trip details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not a member of this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTrip
      summary: Update trip details
      tags:
        - Trips
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
      responses:
        "200":
          description: Trip updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to edit this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrip
      summary: Delete trip
      tags:
        - Trips
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Trip deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Only trip owner can delete trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/days:
    get:
      operationId: listTripDays
      summary: List days for a trip
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of trip days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDayListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTripDay
      summary: Create or find a trip day
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTripDayRequest"
      responses:
        "201":
          description: Day created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDayResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/itinerary-items:
    get:
      operationId: listItineraryItems
      summary: List itinerary items for a trip
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: trip_day_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of itinerary items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createItineraryItem
      summary: Create an itinerary item or stop
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItineraryItemRequest"
      responses:
        "201":
          description: Item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{trip}/itinerary-items/reorder:
    post:
      operationId: reorderItineraryItems
      summary: Reorder itinerary items for a trip
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: trip
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderItineraryItemsRequest"
      responses:
        "200":
          description: Reordered items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /itinerary-items/{item}:
    get:
      operationId: getItineraryItem
      summary: Get details of an itinerary item
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to view this item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItineraryItem
      summary: Update an itinerary item
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItineraryItemRequest"
      responses:
        "200":
          description: Updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItemResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItineraryItem
      summary: Soft delete an itinerary item
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not authorized to modify this item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/search:
    get:
      operationId: searchPlaces
      summary: Search places by name or address
      tags:
        - Places
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching places.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /places:
    post:
      operationId: createPlace
      summary: Create or retrieve a place
      tags:
        - Places
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorePlaceRequest"
      responses:
        "201":
          description: Place stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /places/{place}:
    get:
      operationId: getPlace
      summary: Get place details
      tags:
        - Places
      security:
        - BearerAuth: []
      parameters:
        - name: place
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Place details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Place not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token issued by /auth/token
  responses:
    Unauthenticated:
      description: A valid access token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Authentication is required.
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              pattern: "^[a-z][a-z0-9_]*$"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: ok
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          minLength: 8
        device_name:
          type: string
          maxLength: 255
        display_name:
          type: string
          maxLength: 255
        locale:
          type: string
          maxLength: 12
        home_timezone:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - display_name
        - email
        - avatar_url
        - locale
        - home_timezone
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        email:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        locale:
          type: string
        home_timezone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/User"
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - token
            - token_type
            - user
          properties:
            token:
              type: string
            token_type:
              type: string
              const: Bearer
            user:
              $ref: "#/components/schemas/User"
    StoreTripRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        primary_timezone:
          type: string
          nullable: true
        origin_country:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        destination_country:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        trip_type:
          type: string
          enum: [leisure, business, family, solo, group]
          nullable: true
        planning_mode:
          type: string
          enum: [diy, existing, guided, simple]
          nullable: true
    UpdateTripRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        primary_timezone:
          type: string
          nullable: true
        origin_country:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        destination_country:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        trip_type:
          type: string
          enum: [leisure, business, family, solo, group]
          nullable: true
        planning_mode:
          type: string
          enum: [diy, existing, guided, simple]
          nullable: true
        status:
          type: string
          enum: [planned, active, completed, archived]
          nullable: true
    Trip:
      type: object
      additionalProperties: false
      required:
        - id
        - owner_id
        - title
        - primary_timezone
        - trip_type
        - planning_mode
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        primary_timezone:
          type: string
        origin_country:
          type: string
          nullable: true
        destination_country:
          type: string
          nullable: true
        trip_type:
          type: string
        planning_mode:
          type: string
          enum: [diy, existing, guided, simple]
        status:
          type: string
          enum: [planned, active, completed, archived]
        version:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [owner, editor, viewer]
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TripResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Trip"
    TripListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
    Place:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - name
        - google_maps_url
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        provider_place_id:
          type: string
          nullable: true
        name:
          type: string
        formatted_address:
          type: string
          nullable: true
        country_code:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        photo_reference:
          type: string
          nullable: true
        attribution:
          type: string
          nullable: true
        google_maps_url:
          type: string
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PlaceResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Place"
    PlaceListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Place"
